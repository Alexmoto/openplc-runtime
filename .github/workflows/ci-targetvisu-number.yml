name: TargetVisu visual regression
on:
  pull_request:
    paths:
      - 'tools/targetvisu/**'
      - 'updates/targetvisu-number-v0.6.0/**'
      - 'updates/targetvisu-graphic-v0.7.0/**'
      - 'updates/targetvisu-screen-bg-v0.8.0/**'
      - 'updates/targetvisu-transparent-v0.9.0/**'
      - 'updates/targetvisu-number-input-v1.0.0/**'
      - 'updates/targetvisu-lamps-v1.1.0/**'
      - '.github/workflows/ci-targetvisu-number.yml'
  push:
    paths:
      - 'tools/targetvisu/**'
      - 'updates/targetvisu-number-v0.6.0/**'
      - '.github/workflows/ci-targetvisu-number.yml'
jobs:
  number-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Runtime and installer Python syntax
        run: |
          python -m py_compile tools/targetvisu/model.py tools/targetvisu/render.py tools/targetvisu/graphics.py tools/targetvisu/keypad.py tools/targetvisu/viewer.py tools/targetvisu/lamp_palette.py updates/targetvisu-screen-bg-v0.8.0/install_update.py updates/targetvisu-transparent-v0.9.0/install_update.py updates/targetvisu-number-input-v1.0.0/install_update.py updates/targetvisu-lamps-v1.1.0/install_update.py updates/targetvisu-number-v0.6.0/install_update.py updates/targetvisu-graphic-v0.7.0/install_update.py
      - name: Test Number bindings, Graphic View states, and backward compatibility
        env:
          PYTHONPATH: tools
        run: >-
          python -m unittest
          targetvisu.tests.test_targetvisu.ModelTests.test_number_dynamic_colors_and_legacy_defaults
          targetvisu.tests.test_graphics.GraphicTests.test_image_state_selector_and_backwards_compatibility
          targetvisu.tests.test_graphics.GraphicTests.test_graphic_selector_binding_validation
          targetvisu.tests.test_graphics.GraphicTests.test_screen_background_image_validation_and_rendering
          targetvisu.tests.test_targetvisu.ModelTests.test_transparent_button_and_number_keep_full_hit_area
          targetvisu.tests.test_graphics.GraphicTests.test_transparent_button_keeps_background_visible_and_border_optional
          targetvisu.tests.test_targetvisu.ModelTests.test_number_mode_write_target_must_match_displayed_variable
          targetvisu.tests.test_keypad.KeypadTests
          targetvisu.tests.test_lamp_palette.LampPaletteTests
          targetvisu.tests.test_targetvisu.ModelTests.test_12_color_indicator_accepts_integer_but_preserves_classic_bool
          -v
