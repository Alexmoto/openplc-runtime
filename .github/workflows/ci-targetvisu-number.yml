name: TargetVisu Number regression
on:
  pull_request:
    paths:
      - 'tools/targetvisu/**'
      - 'updates/targetvisu-number-v0.6.0/**'
      - '.github/workflows/ci-targetvisu-number.yml'
  push:
    paths:
      - 'tools/targetvisu/**'
      - 'updates/targetvisu-number-v0.6.0/**'
      - '.github/workflows/ci-targetvisu-number.yml'
jobs:
  number-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Runtime and installer Python syntax
        run: |
          python -m py_compile tools/targetvisu/model.py tools/targetvisu/render.py updates/targetvisu-number-v0.6.0/install_update.py
      - name: Test Number bindings and backward compatibility
        env:
          PYTHONPATH: tools
        run: |
          python -m unittest targetvisu.tests.test_targetvisu.ModelTests.test_number_dynamic_colors_and_legacy_defaults -v
