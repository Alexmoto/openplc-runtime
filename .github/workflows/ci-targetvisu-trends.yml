name: TargetVisu trend regression
on:
  push:
    branches: [feature/targetvisu-trends]
    paths: ['tools/targetvisu/**', '.github/workflows/ci-targetvisu-trends.yml']
  pull_request:
    branches: [develop, main]
    paths: ['tools/targetvisu/**', '.github/workflows/ci-targetvisu-trends.yml']
jobs:
  trend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q tools/targetvisu
      - name: Trend and core TargetVisu unit tests
        env:
          PYTHONPATH: tools
        run: python -m unittest targetvisu.tests.test_targetvisu -v
